# Offline regression checks (the same fast checks deploy.sh runs), on every push
# and pull request. No network access to NCAR is needed.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tcpyVPI and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the offline checks
        run: |
          set -e
          for t in tests/check_unit_fixes.py tests/check_no_storm_columns.py \
                   tests/check_config_defaults.py tests/check_era5_loader.py \
                   tests/check_outflow_temperature.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
