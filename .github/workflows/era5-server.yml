# Weekly live check that NCAR's ERA5 server still serves the files the built-in
# loader expects (tests/test_era5_server.py). A failure here usually means NCAR
# moved the data again; see "Data source for the built-in ERA5 loader" in the README.
# Note: GitHub pauses scheduled workflows after 60 days without repository
# activity; re-enable it on the Actions tab if that happens.
name: era5-server

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tcpyVPI and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Open one monthly and one hourly ERA5 file on NCAR's server
        env:
          TCPYVPI_NETWORK_TESTS: "1"
        run: python -m pytest -m network tests/test_era5_server.py -v
